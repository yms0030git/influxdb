# 云原生编译打包 + 推送 Docker Hub
# 1) 构建 influxdb3-core tarball  2) 用 tarball 打 Docker 镜像并推送到 Docker Hub
# 触发：推送到 main / release/** / build/** 或 Actions 页手动 Run workflow
# 产物：Artifact 中 .tar.gz；镜像 <DOCKERHUB_USERNAME>/influxdb3-core-obs:3.8.1 与 :latest
# 需在仓库 Settings > Secrets 中配置：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
name: Build InfluxDB 3 Core + Push to Docker Hub

on:
  push:
    branches: [main, 'release/**', 'build/**']
  workflow_dispatch:
    inputs:
      pbs_date:
        description: 'Python Build Standalone 发布日期 (与 .circleci 一致可用 20251205)'
        required: false
        default: '20251205'
      pbs_version:
        description: 'CPython 版本 (如 3.13.11)'
        required: false
        default: '3.13.11'
      artifact_run_id:
        description: '填某次 Run 的 ID 则跳过构建，直接用该次的 tarball 打镜像并推送（Run 页 URL 里的数字）'
        required: false

env:
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.artifact_run_id == '' || github.event.inputs.artifact_run_id == null
    defaults:
      run:
        working-directory: /tmp/workspace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        working-directory: ${{ github.workspace }}
        run: |
          cp -a . /tmp/workspace

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            /tmp/workspace/target
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch Python Build Standalone
        env:
          PBS_DATE: ${{ github.event.inputs.pbs_date || '20251205' }}
          PBS_VERSION: ${{ github.event.inputs.pbs_version || '3.13.11' }}
        run: |
          ./.circleci/scripts/fetch-python-standalone.bash python-artifacts "$PBS_DATE" "$PBS_VERSION"

      - name: Extract Python for target
        run: |
          tar -C /tmp/workspace/python-artifacts -zxvf /tmp/workspace/python-artifacts/all.tar.gz ./${{ env.TARGET }}

      - name: Setup PYO3 env
        run: |
          rustup target add ${{ env.TARGET }}
          echo "PYO3_CONFIG_FILE=/tmp/workspace/python-artifacts/${{ env.TARGET }}/pyo3_config_file.txt" >> $GITHUB_ENV
          echo "PYO3_CROSS_PYTHON_VERSION=3.13" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/tmp/workspace/python-artifacts/${{ env.TARGET }}/python/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install build deps (protoc, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler patchelf

      - name: Cargo release build
        run: |
          cargo build --release --target ${{ env.TARGET }} --workspace
        env:
          PYO3_CONFIG_FILE: /tmp/workspace/python-artifacts/${{ env.TARGET }}/pyo3_config_file.txt

      - name: Adjust RPATH (Linux)
        run: |
          patchelf --set-rpath '$ORIGIN/python/lib:$ORIGIN/../lib/influxdb3/python/lib' \
            "/tmp/workspace/target/${{ env.TARGET }}/release/influxdb3"

      - name: Create tarball
        run: |
          mkdir -p artifacts
          tar -cvf artifacts/influxdb3-core_${{ env.TARGET }}.tar \
            -C "/tmp/workspace/target/${{ env.TARGET }}/release" influxdb3
          tar -rvf artifacts/influxdb3-core_${{ env.TARGET }}.tar \
            -C "/tmp/workspace/python-artifacts/${{ env.TARGET }}" python
          gzip -f artifacts/influxdb3-core_${{ env.TARGET }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: influxdb3-core-${{ env.TARGET }}
          path: /tmp/workspace/artifacts/

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build-release
    if: ${{ github.event_name != 'pull_request' && (github.event.inputs.artifact_run_id == '' || github.event.inputs.artifact_run_id == null) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tarball artifact (current run)
        uses: actions/download-artifact@v4
        with:
          name: influxdb3-core-${{ env.TARGET }}

      - name: Prepare Docker build context
        run: |
          cp "$(find . -name 'influxdb3-core_*.tar.gz' -type f | head -1)" influxdb3-core.tar.gz
          cp .github/docker/entrypoint.sh .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/influxdb3-core-obs:3.8.1
            ${{ secrets.DOCKERHUB_USERNAME }}/influxdb3-core-obs:latest
          build-args: TARBALL=influxdb3-core.tar.gz
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 仅手动触发且填写 artifact_run_id 时运行：用指定 Run 的 tarball 打镜像，不重新构建
  build-and-push-docker-from-run:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.artifact_run_id != '' && github.event.inputs.artifact_run_id != null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tarball artifact (from specified run)
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ github.event.inputs.artifact_run_id }}
          name: influxdb3-core-${{ env.TARGET }}

      - name: Prepare Docker build context
        run: |
          cp "$(find . -name 'influxdb3-core_*.tar.gz' -type f | head -1)" influxdb3-core.tar.gz
          cp .github/docker/entrypoint.sh .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/influxdb3-core-obs:3.8.1
            ${{ secrets.DOCKERHUB_USERNAME }}/influxdb3-core-obs:latest
          build-args: TARBALL=influxdb3-core.tar.gz
          cache-from: type=gha
          cache-to: type=gha,mode=max
